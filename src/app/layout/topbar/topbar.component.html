<nav class="topbar">
      <div class="topbar-left">
        <button class="hamburger" (click)="onToggleSidebar($event)">
          <span></span><span></span><span></span>
        </button>
        <div class="logo">
          <img src="assets/images/kumon-logo.png" alt="Kumon Logo" class="logo-img" />
          <!-- <span class="logo-text">Absence Planner</span> -->
        </div>
      </div>
      <div class="topbar-right">
        <div class="role-switcher">
          <button class="btn-role" [class.active]="currentRole() === 'superadmin'" (click)="switchRole('superadmin')">SuperAdmin</button>
          <button class="btn-role" [class.active]="currentRole() === 'admin'" (click)="switchRole('admin')">Admin</button>
          <button class="btn-role" [class.active]="currentRole() === 'user'" (click)="switchRole('user')">User</button>
        </div>

        <div class="notification-wrapper" (click)="$event.stopPropagation()">
          <button class="btn-icon" (click)="toggleNotifications()">
            <i class="bi bi-bell"></i>
            @if (unreadCount() > 0) {
              <span class="badge">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
            }
          </button>
          @if (showNotifications()) {
            <div class="notification-panel">
              <div class="notif-header">
                <strong>Notifications</strong>
                <button class="btn-link" (click)="markAllRead()">Mark all read</button>
              </div>
              <div class="notif-list">
                @for (n of userNotifications(); track n.id) {
                  <div class="notif-item" [class.unread]="!n.read" (click)="markRead(n.id)">
                    <span class="notif-type">
                      <i class="bi" [ngClass]="n.type === 'holiday' ? 'bi-calendar-event' : n.type === 'absence_approved' ? 'bi-check-circle-fill' : n.type === 'absence_rejected' ? 'bi-x-circle-fill' : 'bi-info-circle'"></i>
                    </span>
                    <div class="notif-content">
                      <p>{{ n.message }}</p>
                      <small>{{ n.createdAt | date:'short' }}</small>
                    </div>
                  </div>
                } @empty {
                  <p class="notif-empty">No notifications</p>
                }
              </div>
            </div>
          }
        </div>

        <div class="user-menu" (click)="$event.stopPropagation()">
          <button class="user-btn" (click)="toggleUserMenu()">
            <span class="avatar">{{ initials() }}</span>
            <span class="user-name">{{ auth.currentUserName() }}</span>
            <span class="caret"><i class="bi bi-chevron-down"></i></span>
          </button>
          @if (showUserMenu()) {
            <div class="dropdown-menu">
              <div class="dropdown-info">
                <strong>{{ auth.currentUserName() }}</strong>
                <small>{{ currentRole() }}</small>
              </div>
              <hr>
              <button class="dropdown-item" (click)="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
          }
        </div>
      </div>
    </nav>
