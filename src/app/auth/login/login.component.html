<div class="login-page">
      <div class="login-card">
        <div class="login-header">
          <span class="login-logo"><i class="bi bi-mortarboard-fill"></i></span>
          <h1>Kumon Absence Planner</h1>
          <p>School Absence Planning System</p>
        </div>

        @if (!otpSent()) {
          <form (ngSubmit)="sendOtp()" class="login-form">
            <div class="form-group">
              <label for="identifier">Email or Phone Number</label>
              <input
                id="identifier"
                type="text"
                [(ngModel)]="identifier"
                name="identifier"
                placeholder="Enter email or phone"
                required
                class="form-input"
              >
            </div>
            @if (errorMsg()) {
              <div class="error-msg">{{ errorMsg() }}</div>
            }
            <button type="submit" class="btn-primary" [disabled]="!identifier">
              Send OTP
            </button>

            <div class="register-link">
              <p>New parent? <button type="button" class="link-btn" (click)="goToRegister()">Create Account</button></p>
            </div>

            <div class="demo-accounts">
              <p class="demo-title">Demo Accounts:</p>
              <div class="demo-list">
                <button type="button" class="demo-btn" (click)="fillDemo('superadmin@school.com')">
                  <strong>SuperAdmin</strong>
                  <span>superadmin&#64;school.com</span>
                </button>
                <button type="button" class="demo-btn" (click)="fillDemo('admin@school.com')">
                  <strong>Admin</strong>
                  <span>admin&#64;school.com</span>
                </button>
                <button type="button" class="demo-btn" (click)="fillDemo('john@parent.com')">
                  <strong>Parent (John)</strong>
                  <span>john&#64;parent.com</span>
                </button>
                <button type="button" class="demo-btn" (click)="fillDemo('jane@parent.com')">
                  <strong>Guardian (Jane)</strong>
                  <span>jane&#64;parent.com</span>
                </button>
              </div>
            </div>
          </form>
        } @else {
          <form (ngSubmit)="verifyOtp()" class="login-form">
            <div class="otp-info">
              <p>OTP sent to <strong>{{ identifier }}</strong></p>
              <small>Enter any 4-digit code to proceed</small>
            </div>
            <div class="form-group">
              <label for="otp">Enter OTP</label>
              <input
                id="otp"
                type="text"
                [(ngModel)]="otp"
                name="otp"
                placeholder="Enter 4-digit OTP"
                maxlength="4"
                class="form-input otp-input"
              >
            </div>
            @if (errorMsg()) {
              <div class="error-msg">{{ errorMsg() }}</div>
            }
            <button type="submit" class="btn-primary" [disabled]="otp.length !== 4">
              Verify & Login
            </button>
            <button type="button" class="btn-secondary" (click)="goBack()">
              ← Back
            </button>
          </form>
        }
      </div>
    </div>
